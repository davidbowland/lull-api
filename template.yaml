AWSTemplateFormatVersion: 2010-09-09
Description: >-
  API for Lull project

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy

Mappings:
  EnvironmentMap:
    prod:
      certificate: adce1a21-90b4-4120-8548-111215e582f0
      corsDomain: https://lull.dbowland.com
      createModelPuzzlesTimeout: 900
      createPhrasePuzzlesTimeout: 900
      createPackTimeout: 900
      domain: lull-api.dbowland.com
      logStreamFunction: log-subscriber
      # Must never be in the future: isValidPackDate requires
      # packStartDate <= value <= tomorrow, so a start date later than tomorrow fails both bounds
      # and GET /packs/{date} returns 400 forever while the generator writes packs nobody can fetch.
      packStartDate: '2026-08-01'
      packsTable: lull-api-packs
      project: lull
      promptsTable: lull-api-prompts
      # ENABLED in BOTH environments, unlike connections. On-demand fill repairs a missing date
      # only when someone asks for it, so without the schedule a test environment would generate
      # nothing until it was visited, and never pre-generate tomorrow.
      #
      # A State string, NOT an Enabled boolean, and the difference is not cosmetic. SAM types
      # Enabled as a bool but leaves supports_intrinsics on, so a !FindInMap reaches
      # `events_rule.State = "ENABLED" if self.Enabled else "DISABLED"` still wrapped as a dict --
      # which is truthy in Python, so EVERY environment came out ENABLED no matter what this
      # mapping said. State is a pass-through property, so CloudFormation resolves the intrinsic
      # itself and the value here is actually the value that ships.
      scheduledPackCreationState: ENABLED
      zoneId: Z072422417XWM8PIXXSFA
    test:
      certificate: 6a48cba7-feb9-4de5-8cbf-d383140fcdef
      corsDomain: https://lull.bowland.link
      createModelPuzzlesTimeout: 900
      createPhrasePuzzlesTimeout: 900
      createPackTimeout: 900
      domain: lull-api.bowland.link
      logStreamFunction: log-subscriber-test
      packStartDate: '2026-08-01'
      packsTable: lull-api-packs-test
      project: lull-test
      promptsTable: lull-api-prompts-test
      scheduledPackCreationState: ENABLED
      zoneId: Z01312547RGU1BYKIJXY

Resources:
  # API Gateway

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - OPTIONS
        AllowOrigins:
          - !FindInMap [EnvironmentMap, !Ref Environment, corsDomain]
      Domain:
        BasePath:
          - /v1
        CertificateArn: !Sub
          - 'arn:aws:acm:${AWS::Region}:${AWS::AccountId}:certificate/${Certificate}'
          - Certificate: !FindInMap [EnvironmentMap, !Ref Environment, certificate]
        DomainName: !FindInMap [EnvironmentMap, !Ref Environment, domain]
        EndpointConfiguration: REGIONAL
        Route53:
          DistributionDomainName: !FindInMap [EnvironmentMap, !Ref Environment, domain]
          HostedZoneId: !FindInMap [EnvironmentMap, !Ref Environment, zoneId]
      FailOnWarnings: true
      StageName: v1
      # An unauthenticated public API with no ceiling. These numbers are far above any real
      # player -- the whole point of packs is that a device asks about eight times a week --
      # and far below anything that would matter on a PAY_PER_REQUEST table.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  # Packs

  # GetPackDatesFunction is deliberately NOT deployed yet.
  #
  # GET /packs exists in src/ and is tested, but nothing consumes it: the shelf renders one
  # day and there is no archive route. Deploying it would put a public, unauthenticated
  # endpoint on the internet that does a full paginated Scan of the packs table on every
  # request -- DynamoDB charges on bytes read from the table BEFORE ProjectionExpression
  # applies, so the cost of one call grows with the archive forever, with no client asking
  # for it and nothing to point at if someone else does.
  #
  # The handler, the service, and their tests stay. Restore this block, and the
  # GetPackDatesLogGroup/Subscription pair alongside it, when the archive screen lands --
  # and give the Scan a second look then, because a growing full-table read per request is
  # the wrong shape for a route that will be called on every app open.

  GetPackByDateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-pack-by-date.getPackByDateHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1536
      Description: Retrieve the pack for a date
      Policies:
        - AWSLambdaBasicExecutionRole
        # The GET path writes now: it tops a missing or incomplete pack up during the request, so a
        # date the nightly schedule missed or only half-filled is repaired by the first player who
        # asks for it rather than staying short until the next scheduled run.
        #
        # Exactly the two operations the handler calls, scoped to this table's ARN -- deliberately
        # not a managed policy template. This route is unauthenticated and internet-facing, and the
        # archive of past days cannot be regenerated, which is why the table carries Retain on both
        # delete and replace plus PITR. Every broader option leaves a way to destroy it:
        # DynamoDBCrudPolicy grants dynamodb:DeleteItem outright, and even DynamoDBWritePolicy
        # grants dynamodb:BatchWriteItem, which deletes through DeleteRequest entries. Neither is
        # reachable from this code today; both would be reachable from anything that ever got to
        # run in this function.
        # UpdateItem alongside them for the generation claim, which stamps GenerationStarted on an
        # existing pack item. Still no DeleteItem and still no managed policy template.
        - Statement:
            - Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Effect: Allow
              Resource: !GetAtt PacksTable.Arn
        # The request path hands off the puzzles that need a model call and does not wait. BOTH async
        # builders, because invokeSlowGenerators asks both under one claim -- a grant on one of them
        # makes the other's invoke throw, which lambda.ts swallows into a logError and nothing else.
        # Still scoped to two named function ARNs, so this role cannot invoke anything else in the
        # account.
        - Statement:
            - Action:
                - lambda:InvokeFunction
              Effect: Allow
              Resource:
                - !GetAtt CreateModelPuzzlesFunction.Arn
                - !GetAtt CreatePhrasePuzzlesFunction.Arn
      Environment:
        Variables:
          CREATE_MODEL_PUZZLES_FUNCTION_NAME: !Ref CreateModelPuzzlesFunction
          CREATE_PHRASE_PUZZLES_FUNCTION_NAME: !Ref CreatePhrasePuzzlesFunction
          DYNAMODB_PACKS_TABLE_NAME: !Ref PacksTable
          PACK_GENERATION_TIMEOUT: !FindInMap [EnvironmentMap, !Ref Environment, createPackTimeout]
          PACK_START_DATE: !FindInMap [EnvironmentMap, !Ref Environment, packStartDate]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /packs/{date}
            Method: get
      Tags:
        'created-by': 'lull-api'
        'created-for': 'lull'
        'environment': !Ref Environment
      Timeout: 15
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2023'
        Sourcemap: true
        EntryPoints:
          - src/handlers/get-pack-by-date.ts

  GetPackByDateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetPackByDateFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  GetPackByDateGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref GetPackByDateLogGroup

  # Scheduled pack creation

  CreatePackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/create-pack.createPackHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1536
      Description: Generate the daily pack of Lull puzzles
      Policies:
        - AWSLambdaBasicExecutionRole
        # Exactly the two operations createPack calls -- getPackByDate and setPackByDate through
        # buildPack (src/services/packs.ts:62-102) -- scoped to this table's ARN, deliberately not a
        # managed policy template. This function runs on a cron with no human in the loop, and the
        # archive of past days cannot be regenerated, which is why the table carries Retain on both
        # delete and replace plus PITR. DynamoDBCrudPolicy, which this used to hold, grants
        # dynamodb:DeleteItem outright and dynamodb:BatchWriteItem with it -- and BatchWriteItem
        # deletes through DeleteRequest entries. Neither was reachable from this code; both were
        # reachable from anything that ever got to run in this function. This is the same argument
        # GetPackByDateFunction makes at :124-140, applied to the one role that had not had it.
        - Statement:
            - Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Effect: Allow
              Resource: !GetAtt PacksTable.Arn
        # NO Bedrock, deliberately. This builds only the self-contained puzzles -- goFigure needs
        # nothing but a date -- and hands off whatever needs a model. Keeping the model call out of
        # the function that runs unattended on a cron is the whole point of the split, and it is the
        # same reason it holds an invoke on the two builders instead: this role may ASK for model
        # work, never do it.
        - Statement:
            - Action:
                - lambda:InvokeFunction
              Effect: Allow
              Resource:
                - !GetAtt CreateModelPuzzlesFunction.Arn
                - !GetAtt CreatePhrasePuzzlesFunction.Arn
      Environment:
        Variables:
          CREATE_MODEL_PUZZLES_FUNCTION_NAME: !Ref CreateModelPuzzlesFunction
          CREATE_PHRASE_PUZZLES_FUNCTION_NAME: !Ref CreatePhrasePuzzlesFunction
          DYNAMODB_PACKS_TABLE_NAME: !Ref PacksTable
          PACK_START_DATE: !FindInMap [EnvironmentMap, !Ref Environment, packStartDate]
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(33 3 * * ? *)'
            Description: Generate tomorrow's pack between 3-4am UTC (UTC+14 is max)
            State: !FindInMap [EnvironmentMap, !Ref Environment, scheduledPackCreationState]
        RetrySchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(33 5 * * ? *)'
            # 05:33, not 15:33. The shelf renders the player's LOCAL date while this targets a UTC
            # one, and local day X ends at 15:00 UTC for UTC+9 -- so a 15:33 repair landed after the
            # day it was repairing had finished for everyone from Japan eastward, roughly a quarter
            # of the world's time zones. 05:33 is after the 03:33 nightly and before any local day
            # ends.
            #
            # A complete pack is never regenerated, so this is a no-op on a healthy day. Without it
            # an incomplete pack stays incomplete all day, because the nightly run always targets
            # tomorrow, and clients refetching while incomplete would re-request forever.
            Description: Top up today's and tomorrow's packs if a run left either incomplete
            State: !FindInMap [EnvironmentMap, !Ref Environment, scheduledPackCreationState]
            Input: '{"retryToday": true}'
      Tags:
        'created-by': 'lull-api'
        'created-for': 'lull'
        'environment': !Ref Environment
      Timeout: !FindInMap [EnvironmentMap, !Ref Environment, createPackTimeout]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2023'
        Sourcemap: true
        EntryPoints:
          - src/handlers/create-pack.ts

  CreatePackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreatePackFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  CreatePackGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref CreatePackLogGroup

  # Phrase-backed puzzles

  # One of exactly TWO functions in this stack that call a model, and one of two holding bedrock:* or
  # a read on the prompts table. The property that survives the second one -- and the one that
  # matters -- is that THE REQUEST PATH AND THE NIGHTLY PACK BUILDER HOLD NO BEDROCK GRANT AT ALL.
  # That is enforced at the module graph by the data-only registry, not merely at the policy: an
  # implementation import into generators/index.ts would put the Bedrock SDK into
  # GetPackByDateFunction's bundle regardless of what this file says.
  #
  # It generates a date's phrases, immediately turns them into the puzzles that need them, and
  # discards them -- nothing is stored between the call and the puzzles. Its callers (the request
  # path and the nightly pack run) build every self-contained puzzle first and hand off only this.
  #
  # A failed run leaves a short pack rather than no pack, because goFigure is already written by
  # the time this is invoked.
  #
  # NO schedule of its own. It is invoked only by whoever built the self-contained half and found
  # work outstanding, which is the 03:33 nightly run, the 05:33 retry, and the request path. A
  # separate cron would fire before the pack it is filling exists, and the 05:33 retry already
  # provides a daily second attempt if an invoke or a model call failed.
  CreatePhrasePuzzlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/create-phrase-puzzles.createPhrasePuzzlesHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1536
      Description: Generate a date's phrases and turn them into puzzles
      Policies:
        - AWSLambdaBasicExecutionRole
        # Reads the target pack and the recent ones for the already-used phrase list (BatchGetItem
        # is its own action), then writes the puzzles it built. No DeleteItem, matching every other
        # role on this table. All three are hand-scoped statements rather than managed policy
        # templates, which is what makes that sentence a property of the stack rather than of this
        # block.
        - Statement:
            - Action:
                - dynamodb:BatchGetItem
                - dynamodb:GetItem
                - dynamodb:PutItem
              Effect: Allow
              Resource: !GetAtt PacksTable.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref PromptsTable
        # Allow invoking a model in Bedrock. One of exactly TWO roles in this stack that may -- the
        # request path and the nightly pack builder hold no Bedrock grant at all, which is what the
        # data-only registry enforces at the module graph rather than merely at the policy.
        #
        # SCOPED while it was being copied to the second role, because after that there are two
        # places to fix and one of them gets missed. It was Resource: '*', which let this role invoke
        # any model in the account. It is now the inference profile this stack actually uses --
        # prompts/*.txt config.model is `us.anthropic.claude-opus-5` -- plus the three foundation
        # models that profile routes to, resolved from the account rather than guessed. A wrong ARN
        # here is an AccessDeniedException on every nightly run with nothing but a generic swallow to
        # explain it.
        #
        # THE REGION IS A WILDCARD on the foundation models and only there: a cross-region inference
        # profile routes to us-east-1, us-east-2 and us-west-2, so the caller's own region is not the
        # region the model runs in. The profile ARN stays pinned to this stack's region and account.
        #
        # A model-backed type whose prompt names a DIFFERENT model gets AccessDenied here, by design
        # -- a second model is a second line in this list, added deliberately, on the branch that
        # needs it.
        #
        # aws-marketplace:Subscribe is DROPPED outright: subscription is a one-time account action,
        # not a runtime one, and a role that can subscribe the account to new Marketplace offerings
        # is a role that can spend money nobody asked it to. ViewSubscriptions has no resource-level
        # permission and stays on '*' in its own statement, which is why the block is two statements.
        #
        # Two roles, one shape. If you are editing one of them, edit both.
        - Version: 2012-10-17
          Statement:
            - Action:
                - 'aws-marketplace:ViewSubscriptions'
              Effect: Allow
              Resource: '*'
            - Action:
                - 'bedrock:InvokeModel*'
              Effect: Allow
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-opus-5'
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-opus-5'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-opus-5'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-opus-5'
      Environment:
        Variables:
          DEBUG_LOGGING: 'false'
          DYNAMODB_PACKS_TABLE_NAME: !Ref PacksTable
          DYNAMODB_PROMPTS_TABLE_NAME: !Ref PromptsTable
          INSPIRATION_ADJECTIVES_COUNT: 5
          INSPIRATION_NOUNS_COUNT: 10
          INSPIRATION_VERBS_COUNT: 8
          LLM_PHRASE_PROMPT_ID: create-phrases
          LLM_REVIEW_PROMPT_ID: review-phrases
          PHRASE_HISTORY_DAYS: 20
      # Async invocations retry TWICE by default, and this template carried no EventInvokeConfig
      # anywhere -- so a timing-out phrase build has already been costing 3x the Bedrock spend,
      # silently. This is a FIX, not a preparation. The 05:33 retry and the request path already
      # provide bounded, IDEMPOTENT retries that re-read what is missing; Lambda's async retry
      # re-runs the entire model batch at full cost with no rate limit. CLAUDE.md: never retry
      # unbounded.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Tags:
        'created-by': 'lull-api'
        'created-for': 'lull'
        'environment': !Ref Environment
      Timeout: !FindInMap [EnvironmentMap, !Ref Environment, createPhrasePuzzlesTimeout]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2023'
        Sourcemap: true
        EntryPoints:
          - src/handlers/create-phrase-puzzles.ts

  CreatePhrasePuzzlesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreatePhrasePuzzlesFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  CreatePhrasePuzzlesGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref CreatePhrasePuzzlesLogGroup

  # Model-backed puzzles

  # The SECOND of exactly two functions in this stack that call a model. It exists rather than
  # sharing the phrase builder's invocation because a TIMEOUT is the one failure mode a per-call
  # catch cannot contain: that function already makes two serial Opus calls inside a 900-second
  # ceiling, and sharing one invocation would put an experimental puzzle in front of the six phrases
  # the pack depends on.
  #
  # ONE function for every model-backed type, not one per type. A function per type is a role per
  # type holding bedrock:InvokeModel*, plus a log group and a SubscriptionFilter each -- and nothing
  # in CloudFormation ties a function to its pair, so the coupling is held by whoever is copying the
  # block. The "GetPackDatesFunction is deliberately NOT deployed yet" block above is what that costs
  # when it goes wrong -- eleven lines of prose standing in for a coupling the template cannot hold.
  # Named rather than cited by line: this task moved those numbers and the next one will again.
  #
  # NO schedule of its own, for the reason CreatePhrasePuzzlesFunction already carries: a separate
  # cron would fire before the pack it is filling exists. It is invoked by invokeSlowGenerators, from
  # the 03:33 nightly, the 05:33 retry and the request path.
  CreateModelPuzzlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/create-model-puzzles.createModelPuzzlesHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1536
      Description: Generate a date's model-backed puzzles
      Policies:
        - AWSLambdaBasicExecutionRole
        # Reads the target pack and the recent ones for the per-type exclusion lists (BatchGetItem is
        # its own action), then writes the puzzles it built. Also everything createPack needs, which
        # is the same GetItem and PutItem -- this handler repairs the non-inRequest self-contained
        # lane before it does any model work. No DeleteItem, matching every other role on this table.
        - Statement:
            - Action:
                - dynamodb:BatchGetItem
                - dynamodb:GetItem
                - dynamodb:PutItem
              Effect: Allow
              Resource: !GetAtt PacksTable.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref PromptsTable
        # The same scoped statement CreatePhrasePuzzlesFunction carries, and the argument for every
        # line of it is written out there. Two roles, one shape; if you are editing one of them, edit
        # both.
        - Version: 2012-10-17
          Statement:
            - Action:
                - 'aws-marketplace:ViewSubscriptions'
              Effect: Allow
              Resource: '*'
            - Action:
                - 'bedrock:InvokeModel*'
              Effect: Allow
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-opus-5'
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-opus-5'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-opus-5'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-opus-5'
      Environment:
        Variables:
          DEBUG_LOGGING: 'false'
          DYNAMODB_PACKS_TABLE_NAME: !Ref PacksTable
          DYNAMODB_PROMPTS_TABLE_NAME: !Ref PromptsTable
          # NOT phrase-only, whatever the name suggests, and omitting it FAILS SILENTLY in exactly the
          # shape PHRASE_HISTORY_DAYS does below. Themed Anagrams seeds its prompt with a random
          # sample of nouns, and that seeding is load-bearing rather than decorative: an unseeded
          # model asked for themes returns Kitchen, Ocean, Weather every night. Absent, config.ts's
          # parseInt is NaN, getRandomSample computes Math.min(NaN, len), its loop never runs, and it
          # returns [] -- so the mechanism degrades to nothing. The generator logs its own ERROR on a
          # non-finite count, which is the one thing that keeps that degradation visible.
          INSPIRATION_NOUNS_COUNT: 10
          # Each model-backed type adds one LLM_*_PROMPT_ID here on its own branch. The id is the
          # prompt FILENAME without its extension (scripts/deploy-prompts.ts), and a typo is a
          # readable log line rather than a silent short pack, because getPromptById has a named
          # error.
          LLM_ANAGRAM_PROMPT_ID: create-anagram-sets
          #
          # PACK_START_DATE because createPack reaches utils/pack-date.ts, which reads it at module
          # scope; without it the repair path throws on its first date comparison.
          PACK_START_DATE: !FindInMap [EnvironmentMap, !Ref Environment, packStartDate]
          # PHRASE_HISTORY_DAYS is NOT phrase-only here, and omitting it FAILS SILENTLY rather than
          # loudly: parseInt(undefined) is NaN, Math.max(NaN, 0) is NaN, Array.from({length: NaN}) is
          # [], getRecentPacks([]) is [], and every model type then generates with no anti-repetition
          # at all while nothing logs. The number matches the phrase builder's because both are
          # windows on the same archive.
          PHRASE_HISTORY_DAYS: 20
      # Both builders, for the reason spelled out on CreatePhrasePuzzlesFunction. This one is new
      # rather than a fix, and it is the reason the fan-out arithmetic comes out ahead at all: two
      # async builders at the default retry count is six model batches for one bad night.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Tags:
        'created-by': 'lull-api'
        'created-for': 'lull'
        'environment': !Ref Environment
      Timeout: !FindInMap [EnvironmentMap, !Ref Environment, createModelPuzzlesTimeout]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2023'
        Sourcemap: true
        EntryPoints:
          - src/handlers/create-model-puzzles.ts

  CreateModelPuzzlesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateModelPuzzlesFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  # This pair is three resources deep, nothing in CloudFormation ties a function to it, and it is the
  # ONLY alarm in this stack. FilterPattern is POSITIONAL -- it matches only events whose
  # space-delimited layout fits four tokens, keying on level="ERROR" in the third field -- and the
  # deploy runbook reads it against a real logError line, because nothing in this repo has ever
  # checked that logError's emitted shape satisfies it.
  CreateModelPuzzlesGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref CreateModelPuzzlesLogGroup

  # DynamoDB

  # Prompt text and config, pushed from prompts/ by scripts/deploy-prompts.ts on each pipeline run.
  # Tuning a prompt is not a code change. UpdatedAt is the sort key so older revisions stay
  # readable rather than being overwritten, which is what makes a bad prompt deploy diffable.
  PromptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: PromptId
          AttributeType: S
        - AttributeName: UpdatedAt
          AttributeType: N
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PromptId
          KeyType: HASH
        - AttributeName: UpdatedAt
          KeyType: RANGE
      TableName: !FindInMap [EnvironmentMap, !Ref Environment, promptsTable]
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  PacksTable:
    Type: AWS::DynamoDB::Table
    # Retain on delete and on replace, and keep point-in-time recovery.
    # connections-api regenerates a missing game on demand; Lull now fills a missing pack on demand
    # too, but only from the generators graded fast enough for a request, and createPack only ever
    # targets today or tomorrow on a schedule -- so a deleted historical pack is not guaranteed to
    # come back identical, and the ids a player's progress is keyed to would not survive it.
    # A stack delete or an accidental table replacement would destroy the entire archive with no
    # way back.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: Date
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: Date
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TableName: !FindInMap [EnvironmentMap, !Ref Environment, packsTable]
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment
