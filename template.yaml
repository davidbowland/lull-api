AWSTemplateFormatVersion: 2010-09-09
Description: >-
  API for Lull project

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy

Mappings:
  EnvironmentMap:
    prod:
      certificate: adce1a21-90b4-4120-8548-111215e582f0
      corpusTable: lull-api-corpus
      corsDomain: https://lull.dbowland.com
      createCorpusTimeout: 900
      createPackTimeout: 900
      domain: lull-api.dbowland.com
      logStreamFunction: log-subscriber
      # Must never be in the future: isValidPackDate requires
      # packStartDate <= value <= tomorrow, so a start date later than tomorrow fails both bounds
      # and GET /packs/{date} returns 400 forever while the generator writes packs nobody can fetch.
      packStartDate: '2026-08-01'
      packsTable: lull-api-packs
      project: lull
      promptsTable: lull-api-prompts
      # ENABLED in BOTH environments, unlike connections. On-demand fill repairs a missing date
      # only when someone asks for it, so without the schedule a test environment would generate
      # nothing until it was visited, and never pre-generate tomorrow.
      #
      # A State string, NOT an Enabled boolean, and the difference is not cosmetic. SAM types
      # Enabled as a bool but leaves supports_intrinsics on, so a !FindInMap reaches
      # `events_rule.State = "ENABLED" if self.Enabled else "DISABLED"` still wrapped as a dict --
      # which is truthy in Python, so EVERY environment came out ENABLED no matter what this
      # mapping said. State is a pass-through property, so CloudFormation resolves the intrinsic
      # itself and the value here is actually the value that ships.
      scheduledPackCreationState: ENABLED
      zoneId: Z072422417XWM8PIXXSFA
    test:
      certificate: 6a48cba7-feb9-4de5-8cbf-d383140fcdef
      corpusTable: lull-api-corpus-test
      corsDomain: https://lull.bowland.link
      createCorpusTimeout: 900
      createPackTimeout: 900
      domain: lull-api.bowland.link
      logStreamFunction: log-subscriber-test
      packStartDate: '2026-08-01'
      packsTable: lull-api-packs-test
      project: lull-test
      promptsTable: lull-api-prompts-test
      scheduledPackCreationState: ENABLED
      zoneId: Z01312547RGU1BYKIJXY

Resources:
  # API Gateway

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - OPTIONS
        AllowOrigins:
          - !FindInMap [EnvironmentMap, !Ref Environment, corsDomain]
      Domain:
        BasePath:
          - /v1
        CertificateArn: !Sub
          - 'arn:aws:acm:${AWS::Region}:${AWS::AccountId}:certificate/${Certificate}'
          - Certificate: !FindInMap [EnvironmentMap, !Ref Environment, certificate]
        DomainName: !FindInMap [EnvironmentMap, !Ref Environment, domain]
        EndpointConfiguration: REGIONAL
        Route53:
          DistributionDomainName: !FindInMap [EnvironmentMap, !Ref Environment, domain]
          HostedZoneId: !FindInMap [EnvironmentMap, !Ref Environment, zoneId]
      FailOnWarnings: true
      StageName: v1
      # An unauthenticated public API with no ceiling. These numbers are far above any real
      # player -- the whole point of packs is that a device asks about eight times a week --
      # and far below anything that would matter on a PAY_PER_REQUEST table.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  # Packs

  # GetPackDatesFunction is deliberately NOT deployed yet.
  #
  # GET /packs exists in src/ and is tested, but nothing consumes it: the shelf renders one
  # day and there is no archive route. Deploying it would put a public, unauthenticated
  # endpoint on the internet that does a full paginated Scan of the packs table on every
  # request -- DynamoDB charges on bytes read from the table BEFORE ProjectionExpression
  # applies, so the cost of one call grows with the archive forever, with no client asking
  # for it and nothing to point at if someone else does.
  #
  # The handler, the service, and their tests stay. Restore this block, and the
  # GetPackDatesLogGroup/Subscription pair alongside it, when the archive screen lands --
  # and give the Scan a second look then, because a growing full-table read per request is
  # the wrong shape for a route that will be called on every app open.

  GetPackByDateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-pack-by-date.getPackByDateHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1536
      Description: Retrieve the pack for a date
      Policies:
        - AWSLambdaBasicExecutionRole
        # The GET path writes now: it tops a missing or incomplete pack up during the request, so a
        # date the nightly schedule missed or only half-filled is repaired by the first player who
        # asks for it rather than staying short until the next scheduled run.
        #
        # Exactly the two operations the handler calls, scoped to this table's ARN -- deliberately
        # not a managed policy template. This route is unauthenticated and internet-facing, and the
        # archive of past days cannot be regenerated, which is why the table carries Retain on both
        # delete and replace plus PITR. Every broader option leaves a way to destroy it:
        # DynamoDBCrudPolicy grants dynamodb:DeleteItem outright, and even DynamoDBWritePolicy
        # grants dynamodb:BatchWriteItem, which deletes through DeleteRequest entries. Neither is
        # reachable from this code today; both would be reachable from anything that ever got to
        # run in this function.
        # UpdateItem alongside them for the generation claim, which stamps GenerationStarted on an
        # existing pack item. Still no DeleteItem and still no managed policy template.
        - Statement:
            - Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Effect: Allow
              Resource: !GetAtt PacksTable.Arn
        # The request path hands an incomplete pack to the async builder and does not wait. Scoped
        # to that one function, so this role cannot invoke anything else in the account.
        - Statement:
            - Action:
                - lambda:InvokeFunction
              Effect: Allow
              Resource: !GetAtt CreatePackFunction.Arn
        # Missing Vowels is graded inRequest, so the request path reads the corpus and marks the
        # entries it consumed. Same reasoning as the grant above: exactly the two operations the
        # code calls, scoped to the one table ARN, and no managed policy template. Deliberately no
        # PutItem -- only CreateCorpusFunction writes a corpus, and this function must not be able
        # to replace one. UpdateItem is the ADD that unions used ids, which cannot delete an item.
        - Statement:
            - Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Effect: Allow
              Resource: !GetAtt CorpusTable.Arn
      Environment:
        Variables:
          CREATE_PACK_FUNCTION_NAME: !Ref CreatePackFunction
          DYNAMODB_CORPUS_TABLE_NAME: !Ref CorpusTable
          DYNAMODB_PACKS_TABLE_NAME: !Ref PacksTable
          PACK_GENERATION_TIMEOUT: !FindInMap [EnvironmentMap, !Ref Environment, createPackTimeout]
          PACK_START_DATE: !FindInMap [EnvironmentMap, !Ref Environment, packStartDate]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /packs/{date}
            Method: get
      Tags:
        'created-by': 'lull-api'
        'created-for': 'lull'
        'environment': !Ref Environment
      Timeout: 15
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2023'
        Sourcemap: true
        EntryPoints:
          - src/handlers/get-pack-by-date.ts

  GetPackByDateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetPackByDateFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  GetPackByDateGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref GetPackByDateLogGroup

  # Scheduled pack creation

  CreatePackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/create-pack.createPackHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1536
      Description: Generate the daily pack of Lull puzzles
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref PacksTable
        # Reads the corpus and marks entries used. No PutItem and no Bedrock: the nightly pack run
        # must not be able to write a corpus, and it makes no model call -- that is
        # CreateCorpusFunction's job, half an hour earlier and in its own Lambda.
        # PutItem joins them because this function can now GENERATE a corpus, not just read one --
        # that is what lets a pack the request path could not finish actually get finished on a
        # cold stack. Still no DeleteItem.
        - Statement:
            - Action:
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Effect: Allow
              Resource: !GetAtt CorpusTable.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref PromptsTable
        # A model call from here is safe in the way it is not from the request path: this function
        # runs on a schedule or from a fire-and-forget invoke, under a 900-second timeout, with
        # nobody waiting on the response.
        - Version: 2012-10-17
          Statement:
            - Action:
                - 'aws-marketplace:ViewSubscriptions'
                - 'aws-marketplace:Subscribe'
                - 'bedrock:InvokeModel*'
              Effect: Allow
              Resource: '*'
      Environment:
        Variables:
          CORPUS_GENERATION_TIMEOUT: !FindInMap [EnvironmentMap, !Ref Environment, createCorpusTimeout]
          CORPUS_PHRASE_COUNT: 30
          DEBUG_LOGGING: 'false'
          DYNAMODB_CORPUS_TABLE_NAME: !Ref CorpusTable
          DYNAMODB_PACKS_TABLE_NAME: !Ref PacksTable
          DYNAMODB_PROMPTS_TABLE_NAME: !Ref PromptsTable
          INSPIRATION_ADJECTIVES_COUNT: 5
          INSPIRATION_NOUNS_COUNT: 10
          INSPIRATION_VERBS_COUNT: 8
          LLM_CORPUS_PROMPT_ID: create-phrase-corpus
          PACK_START_DATE: !FindInMap [EnvironmentMap, !Ref Environment, packStartDate]
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(33 3 * * ? *)'
            Description: Generate tomorrow's pack between 3-4am UTC (UTC+14 is max)
            State: !FindInMap [EnvironmentMap, !Ref Environment, scheduledPackCreationState]
        RetrySchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(33 5 * * ? *)'
            # 05:33, not 15:33. The shelf renders the player's LOCAL date while this targets a UTC
            # one, and local day X ends at 15:00 UTC for UTC+9 -- so a 15:33 repair landed after the
            # day it was repairing had finished for everyone from Japan eastward, roughly a quarter
            # of the world's time zones. 05:33 is after the 03:33 nightly and before any local day
            # ends.
            #
            # A complete pack is never regenerated, so this is a no-op on a healthy day. Without it
            # an incomplete pack stays incomplete all day, because the nightly run always targets
            # tomorrow, and clients refetching while incomplete would re-request forever.
            Description: Top up today's and tomorrow's packs if a run left either incomplete
            State: !FindInMap [EnvironmentMap, !Ref Environment, scheduledPackCreationState]
            Input: '{"retryToday": true}'
      Tags:
        'created-by': 'lull-api'
        'created-for': 'lull'
        'environment': !Ref Environment
      Timeout: !FindInMap [EnvironmentMap, !Ref Environment, createPackTimeout]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2023'
        Sourcemap: true
        EntryPoints:
          - src/handlers/create-pack.ts

  CreatePackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreatePackFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  CreatePackGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref CreatePackLogGroup

  # Scheduled corpus creation

  # The ONLY function in this stack that calls a model, and the only one holding bedrock:* or a
  # read on the prompts table. That isolation is the point: a Bedrock call cannot fit inside a
  # request, and it must not sit inside the pack run either, so the corpus is generated on its own
  # schedule and merely READ by the generators. A failed run here degrades to the previous night's
  # corpus rather than taking Missing Vowels, Cryptogram, and Phrazle down with it.
  CreateCorpusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/create-corpus.createCorpusHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 1536
      Description: Generate the nightly phrase corpus shared by the corpus-backed puzzle types
      Policies:
        - AWSLambdaBasicExecutionRole
        # PutItem but no UpdateItem: this function writes a corpus and must never touch the used-id
        # set, which only the generators maintain. No DeleteItem, by the same reasoning as the
        # packs table -- a corpus a pack was built from cannot be regenerated identically.
        - Statement:
            - Action:
                - dynamodb:PutItem
              Effect: Allow
              Resource: !GetAtt CorpusTable.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref PromptsTable
        # Allow invoking a model in Bedrock
        - Version: 2012-10-17
          Statement:
            - Action:
                - 'aws-marketplace:ViewSubscriptions'
                - 'aws-marketplace:Subscribe'
                - 'bedrock:InvokeModel*'
              Effect: Allow
              Resource: '*'
      Environment:
        Variables:
          CORPUS_GENERATION_TIMEOUT: !FindInMap [EnvironmentMap, !Ref Environment, createCorpusTimeout]
          CORPUS_PHRASE_COUNT: 30
          DEBUG_LOGGING: 'false'
          DYNAMODB_CORPUS_TABLE_NAME: !Ref CorpusTable
          DYNAMODB_PROMPTS_TABLE_NAME: !Ref PromptsTable
          INSPIRATION_ADJECTIVES_COUNT: 5
          INSPIRATION_NOUNS_COUNT: 10
          INSPIRATION_VERBS_COUNT: 8
          LLM_CORPUS_PROMPT_ID: create-phrase-corpus
      Events:
        Schedule:
          Type: Schedule
          Properties:
            # 03:03, half an hour ahead of the 03:33 pack run, and targeting the same date. The gap
            # is what makes the ordering real rather than hoped for: a model call with thinking on
            # can run minutes, and the pack run must find the corpus already stored.
            Schedule: 'cron(3 3 * * ? *)'
            Description: Generate tomorrow's shared phrase corpus
            State: !FindInMap [EnvironmentMap, !Ref Environment, scheduledPackCreationState]
      Tags:
        'created-by': 'lull-api'
        'created-for': 'lull'
        'environment': !Ref Environment
      Timeout: !FindInMap [EnvironmentMap, !Ref Environment, createCorpusTimeout]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2023'
        Sourcemap: true
        EntryPoints:
          - src/handlers/create-corpus.ts

  CreateCorpusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateCorpusFunction}
      RetentionInDays: 30
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  CreateCorpusGroupSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      DestinationArn: !Sub
        - 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Function}'
        - Function: !FindInMap [EnvironmentMap, !Ref Environment, logStreamFunction]
      FilterPattern: '[timestamp, uuid, level="ERROR", message]'
      LogGroupName: !Ref CreateCorpusLogGroup

  # DynamoDB

  CorpusTable:
    Type: AWS::DynamoDB::Table
    # Retained for the same reason the packs table is, and the reason is stronger rather than
    # weaker: a stored pack's Missing Vowels puzzles reference phrases from a specific corpus, and
    # the used-id set on that corpus is the only record of which phrases a day already spent.
    # Losing it re-serves phrases players have already seen, and no rerun reconstructs it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: Kind
          AttributeType: S
        - AttributeName: Date
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      # A constant partition key with the date as the sort key, so "the most recent stored corpus"
      # is one descending Query with Limit 1 rather than a Scan whose cost grows with the archive.
      # A constant partition key is a hot-partition shape in general and is entirely fine here: one
      # write a night against a handful of reads a day.
      KeySchema:
        - AttributeName: Kind
          KeyType: HASH
        - AttributeName: Date
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TableName: !FindInMap [EnvironmentMap, !Ref Environment, corpusTable]
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  # Prompt text and config, pushed from prompts/ by scripts/deploy-prompts.ts on each pipeline run.
  # Tuning a prompt is not a code change. UpdatedAt is the sort key so older revisions stay
  # readable rather than being overwritten, which is what makes a bad prompt deploy diffable.
  PromptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: PromptId
          AttributeType: S
        - AttributeName: UpdatedAt
          AttributeType: N
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PromptId
          KeyType: HASH
        - AttributeName: UpdatedAt
          KeyType: RANGE
      TableName: !FindInMap [EnvironmentMap, !Ref Environment, promptsTable]
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  PacksTable:
    Type: AWS::DynamoDB::Table
    # Retain on delete and on replace, and keep point-in-time recovery.
    # connections-api regenerates a missing game on demand; Lull now fills a missing pack on demand
    # too, but only from the generators graded fast enough for a request, and createPack only ever
    # targets today or tomorrow on a schedule -- so a deleted historical pack is not guaranteed to
    # come back identical, and the ids a player's progress is keyed to would not survive it.
    # A stack delete or an accidental table replacement would destroy the entire archive with no
    # way back.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: Date
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: Date
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TableName: !FindInMap [EnvironmentMap, !Ref Environment, packsTable]
      Tags:
        - Key: 'created-by'
          Value: 'lull-api'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment
